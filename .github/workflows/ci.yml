name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - 'packages/ui/openapi2ts.config.ts'
      - 'packages/ui/openapi-templates/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - 'packages/ui/openapi2ts.config.ts'
      - 'packages/ui/openapi-templates/**'

permissions:
  contents: read

jobs:
  validate:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.1'

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun
            node_modules
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Test automation contracts
        run: bun run test:automation

      - name: Build admin
        run: bun run build --filter=ppanel-admin-web
