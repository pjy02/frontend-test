name: Visual Regression

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/admin/**'
      - 'packages/ui/**'
      - 'tests/visual/**'
      - 'playwright.config.ts'
      - 'bun.lock'
      - 'package.json'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/admin/**'
      - 'packages/ui/**'
      - 'tests/visual/**'
      - 'playwright.config.ts'
      - 'bun.lock'
      - 'package.json'

permissions:
  contents: read

jobs:
  compare:
    name: Compare admin screenshots
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.1'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bun x playwright install chromium

      - name: Compare screenshots
        run: bun run test:visual

      - name: Upload visual diff
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-visual-diff
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
